<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Usuário</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
    }

    form {
      background-color: white;
      padding: 15px;
      border-radius: 5px;
      border-left: 5px solid #28a745;
      max-width: 400px;
    }

    input {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      font-size: 16px;
    }

    .error {
      border: 2px solid red;
    }

    #msg {
      margin-top: 10px;
      font-weight: bold;
    }

    .sucesso {
      color: green;
    }

    .falha {
      color: red;
    }
  </style>
</head>
<body>

  <h1>Formulário de Cadastro</h1>

  <form id="form-cadastro">
    <input type="text" id="nome" placeholder="Nome">
    <input type="email" id="email" placeholder="Email">
    <input type="number" id="idade" placeholder="Idade">
    <button type="submit">Cadastrar</button>
  </form>

  <p id="msg"></p>

  <script>
    const form = document.getElementById("form-cadastro");
    const nome = document.getElementById("nome");
    const email = document.getElementById("email");
    const idade = document.getElementById("idade");
    const msg = document.getElementById("msg");

    // Função auxiliar
    const limparCampos = () => {
      nome.value = "";
      email.value = "";
      idade.value = "";
    };

    form.addEventListener("submit", function(event) {
      event.preventDefault(); // impede o refresh da página

      // Desestruturação
      const { value: nomeValor } = nome;
      const { value: emailValor } = email;
      const { value: idadeValor } = idade;

      // Validação simples
      if (!nomeValor || !emailValor || idadeValor < 0) {
        msg.textContent = "Preencha todos os campos corretamente!";
        msg.classList.remove("sucesso");
        msg.classList.add("falha");
        
        // estilo dinâmico
        [nome, email, idade].forEach(input => {
          input.classList.toggle("error", !input.value || input.value < 0);
        });
        return;
      }

      // Criar objeto e salvar no localStorage
      const usuario = { nome: nomeValor, email: emailValor, idade: idadeValor };
      localStorage.setItem("usuario", JSON.stringify(usuario));

      msg.textContent = `Usuário ${nomeValor} cadastrado com sucesso!`;
      msg.classList.remove("falha");
      msg.classList.add("sucesso");

      // Limpa erro e campos após 2 segundos
      [nome, email, idade].forEach(input => input.classList.remove("error"));
      setTimeout(() => {
        msg.textContent = "";
        limparCampos();
      }, 2000);
    });

    // Exibe usuário salvo (se houver)
    window.addEventListener("load", () => {
      const salvo = localStorage.getItem("usuario");
      if (salvo) {
        const { nome, email } = JSON.parse(salvo);
        msg.innerHTML = `Último cadastrado: <strong>${nome}</strong> - ${email}`;
        msg.classList.add("sucesso");
      }
    });
  </script>
</body>
</html>
