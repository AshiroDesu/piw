<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lista de Tarefas</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      padding: 2rem;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
    }
    input, button {
      padding: 0.5rem;
      margin: 0.3rem 0;
      width: 100%;
      font-size: 1rem;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: #eee;
      margin: 0.3rem 0;
      padding: 0.5rem;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .completed {
      text-decoration: line-through;
      color: gray;
    }
    .remove-btn {
      background: crimson;
      color: white;
      border: none;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Lista de Tarefas</h1>
    <input type="text" id="tarefa" placeholder="Digite uma tarefa..." />
    <button id="adicionar">Adicionar</button>
    <ul id="lista"></ul>
  </div>

  <script>
    const input = document.getElementById("tarefa");
    const botao = document.getElementById("adicionar");
    const lista = document.querySelector("#lista");

    botao.addEventListener("click", function () {
      const texto = input.value.trim();
      if (texto === "") return;

      const item = document.createElement("li");
      item.innerHTML = `
        <span>${texto}</span>
        <button class="remove-btn">X</button>
      `;

      lista.appendChild(item);
      input.value = "";

      // Marcar como concluída ao clicar no texto
      item.querySelector("span").addEventListener("click", function () {
        this.classList.toggle("completed");
      });

      // Remover item
      item.querySelector(".remove-btn").addEventListener("click", function () {
        item.remove();
      });
    });

    // Exemplo adicional usando getElementsByTagName
    const allButtons = document.getElementsByTagName("button");
    console.log("Botões na página:", allButtons.length);
  </script>

</body>
</html>
