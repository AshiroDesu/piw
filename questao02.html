<body>
  <h1>Exercício 2 - JavaScript</h1>
  <h2>Aluno: Aglivan Gomes da Silva Junior - 555291</h2>

  <h2>Aplicando desconto nos produtos</h2>
  <p>Retorne os produtos com 10% de desconto usando map.</p>
  <hr>

  <h2>*Abrir console*</h2>

  <script>
    console.log("=== Exercício 2 ===");

    const produtos = [
      { nome: "Camiseta", preco: 50 },
      { nome: "Calça", preco: 100 },
      { nome: "Tênis", preco: 200 }
    ];

    const produtosComDesconto = produtos.map(produto => ({
      ...produto,
      precoComDesconto: produto.preco * 0.9
    }));
    
    console.log("Produtos com desconto:");
    produtosComDesconto.forEach(produto => console.log(produto));
  </script>
</body>
