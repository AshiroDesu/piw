<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>pokemon</title>
    <style>
        body{
            height: 100vh;
        }
        #container{
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .pokemon {
            background-color: antiquewhite;
            width: 100px;
            text-align: center;
        }
        .pokemon img {
            width: 80px;
            height: 80px;
        }
    </style>

</head>
<body id="body">
    <div id="container"></div>
    <script>
      let pokemonCount = 1;
      const container = document.getElementById('container');

      function createPokemonElement(){
       const div = document.createElement('div');
       div.classList.add('pokemon');

        const img = document.createElement('img');
        const label = document.createElement('div');

         const id = String(pokemonCount).padStart(3, '0');
          img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemonCount}.png`;
          label.textContent = `#${id}`;
          pokemonCount++;

        div.appendChild(img);
        div.appendChild(label);
        container.appendChild(div);
      };
      
      const meubody = document.getElementById("body")

      meubody.addEventListener("click", createPokemonElement);
  </script>
    
</body>
</html>
