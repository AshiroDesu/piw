<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>harry async</title>
  <style>
    #container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .hp {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: antiquewhite;
      width: 100px;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
    }

    .hp img {
      width: 80px;
      height: 80px;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    async function fetchHp() {
      try {
        const response = await fetch('https://hp-api.onrender.com/api/characters');
        if (!response.ok) {
          throw new Error(`Erro na requisição: ${response.status}`);
        }

        const data = await response.json();
        const container = document.getElementById('container');

        if (data.length === 0) {
          container.textContent = 'Nenhum personagem encontrado.';
          return;
        }

        data.forEach(character => {
          const hpCard = document.createElement('div');
          hpCard.classList.add('hp');

          const label = document.createElement('div');
          label.textContent = `Nome: ${character.name}`;

          const img = document.createElement('img');
          img.src = character.image;

          hpCard.appendChild(label);
          hpCard.appendChild(img);
          container.appendChild(hpCard);
        });
      } catch (error) {
        document.getElementById('container').textContent = 'Erro ao carregar os dados.';
        console.error(error);
      }
    }

    fetchHp();
  </script>
</body>
</html>
